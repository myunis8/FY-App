<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revisar plano</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
:root{
  --navy:#16283f; --navy-deep:#0e1c2e; --paper:#f1f3f2; --panel:#fff; --line:#dde3e2;
  --ink:#1c2733; --muted:#5b6b7a; --amber:#e2a33d; --amber-deep:#c07f1f;
  --copper:#b5651d; --copper-soft:#f4e3d3; --slate-soft:#eef1f3;
  --green:#2f7d5c; --green-soft:#dcefe4; --danger:#b3432f; --danger-soft:#f8ded7;
  --blue:#2b6ca3; --blue-soft:#dce9f3; --radius:10px;
  font-family:'IBM Plex Sans',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);display:flex;flex-direction:column}
button{font:inherit;cursor:pointer}
input,select{font:inherit}
.mono{font-family:'IBM Plex Mono',Consolas,monospace}

header{background:var(--navy);color:#fff;padding:11px 18px;display:flex;align-items:center;
  gap:14px;flex-wrap:wrap;flex:0 0 auto}
header h1{font-family:'Space Grotesk',sans-serif;font-size:.98rem;margin:0;font-weight:600}
header .sub{font-size:.72rem;color:#9db2c7}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 13px;
  border-radius:var(--radius);font-size:.82rem;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--amber);border-color:var(--amber-deep);color:#2a1e07;font-weight:600}
.btn.ghost{background:transparent;border-color:#33506e;color:#cfe0f0}
.btn.ghost:hover{border-color:#5b7fa5}
.btn.sm{padding:4px 9px;font-size:.75rem}
.btn:disabled{opacity:.5;cursor:not-allowed}

.cuerpo{flex:1;display:grid;grid-template-columns:1fr 340px;min-height:0}
#lienzo{position:relative;overflow:auto;background:#e7eae9;padding:18px}
#envoltorio{position:relative;display:inline-block;background:#fff;box-shadow:0 2px 14px rgba(14,28,46,.14)}
#hoja{display:block;max-width:none}
#capa{position:absolute;inset:0;width:100%;height:100%;overflow:visible}

.amb{fill:var(--copper);fill-opacity:.10;stroke:var(--copper);stroke-opacity:.45;
  stroke-width:.7;cursor:pointer}
.amb:hover{fill-opacity:.22}
.amb.exterior{display:none}
.amb.sel{fill-opacity:.3;stroke-opacity:.9;stroke-width:1.4}
.amb-txt{font-size:4px;fill:var(--copper);font-weight:600;pointer-events:none;
  text-anchor:middle;font-family:'IBM Plex Sans',sans-serif}

.el{cursor:pointer;stroke-width:1.1;fill-opacity:.85}
.el.artefacto{fill:#2b6ca3;stroke:#17456e}
.el.toma{fill:#2f7d5c;stroke:#1d5740}
.el.llave{fill:#e2a33d;stroke:#a06a12}
.el.alimentacion{fill:#b5651d;stroke:#7a410c}
.el.desconocido{fill:#b3432f;stroke:#7d2418}
.el.sel{stroke:#0e1c2e;stroke-width:2.4}
.el.dudoso{stroke-dasharray:2 1.4}
.marca-rev{fill:#fff;pointer-events:none}
.origen{stroke:#b3432f;stroke-width:1.6}

aside{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:16px}
aside h2{font-family:'Space Grotesk',sans-serif;font-size:.85rem;margin:0 0 9px;
  text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.seccion{margin-bottom:22px}
.cifras{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.cifra{background:var(--slate-soft);border-radius:8px;padding:8px 10px}
.cifra b{display:block;font-size:1.05rem;font-family:'IBM Plex Mono',monospace}
.cifra span{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}

.aviso-item{border-left:3px solid var(--copper);background:var(--copper-soft);
  padding:8px 10px;border-radius:0 6px 6px 0;margin-bottom:6px;font-size:.78rem;
  line-height:1.4;cursor:pointer}
.aviso-item.error{border-color:var(--danger);background:var(--danger-soft)}
.aviso-item:hover{filter:brightness(.97)}

.campo{margin-bottom:10px}
.campo label{display:block;font-size:.72rem;font-weight:600;margin-bottom:4px;color:var(--muted)}
.campo input,.campo select{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:7px}
.fila2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vacio-panel{color:var(--muted);font-size:.8rem;line-height:1.5}
.pastilla{display:inline-block;font-size:.66rem;padding:2px 7px;border-radius:99px;
  background:var(--slate-soft);color:var(--muted);font-weight:600;margin-right:4px}
.pastilla.ok{background:var(--green-soft);color:var(--green)}
.pastilla.baja{background:var(--danger-soft);color:var(--danger)}
.leyenda{display:flex;gap:10px;flex-wrap:wrap;font-size:.72rem;color:var(--muted)}
.leyenda label{display:flex;align-items:center;gap:4px;cursor:pointer}
.pt{width:9px;height:9px;border-radius:50%;display:inline-block}
.lista-amb{font-size:.78rem}
.lista-amb div{display:flex;justify-content:space-between;gap:8px;padding:5px 0;
  border-bottom:1px solid var(--line);cursor:pointer}
.lista-amb div:hover{color:var(--copper)}
.lista-amb .m2{color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:.72rem}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy-deep);
  color:#fff;padding:10px 17px;border-radius:var(--radius);font-size:.82rem;display:none;z-index:60}
@media(max-width:900px){.cuerpo{grid-template-columns:1fr}aside{border-left:none;border-top:1px solid var(--line)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <div>
    <h1 id="h-nombre">Revisar plano</h1>
    <div class="sub" id="h-sub">Cargando…</div>
  </div>
  <div class="spacer"></div>
  <label class="sub" for="i-escala">Escala</label>
  <input id="i-escala" class="mono" style="width:92px;padding:5px 8px;border-radius:7px;border:1px solid #33506e;background:#0e1c2e;color:#cfe0f0" placeholder="pt/m">
  <button class="btn ghost" id="b-extraer">Volver a leer</button>
  <button class="btn ghost" id="b-volver">Volver</button>
  <button class="btn primary" id="b-guardar">Guardar</button>
</header>

<div class="cuerpo">
  <div id="lienzo">
    <div id="envoltorio">
      <img id="hoja" alt="Plano de la obra">
      <svg id="capa" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
  </div>

  <aside>
    <div class="seccion">
      <h2>Lo que leí</h2>
      <div class="cifras" id="p-cifras"></div>
      <div style="margin-top:9px;font-size:.74rem;color:var(--muted)" id="p-escala"></div>
    </div>

    <div class="seccion">
      <h2>Mostrar</h2>
      <div class="leyenda" id="p-leyenda"></div>
    </div>

    <div class="seccion">
      <h2>Selección</h2>
      <div id="p-editor"><div class="vacio-panel">Tocá un elemento o un ambiente del plano para corregirlo.</div></div>
    </div>

    <div class="seccion">
      <h2>Ambientes</h2>
      <div class="lista-amb" id="p-ambientes"></div>
    </div>

    <div class="seccion">
      <h2>Para revisar <span class="pastilla" id="p-navisos"></span></h2>
      <div id="p-avisos"></div>
    </div>
  </aside>
</div>

<div id="toast"></div>

<script>
const SUBTIPOS_TOMA = ['toma_doble','toma_simple','toma_tv','toma_datos','toma_exterior',
  'preinstalacion_aa','toma_heladera','toma_horno','toma_microondas','toma_anafe',
  'toma_lavarropas','toma_lavavajillas','toma_termotanque','especial'];
const SUBTIPOS_ART = ['boca_techo','aplique_pared','artefacto_lineal'];
const SUBTIPOS_ALIM = ['alimentacion_extractor','alimentacion_estufa',
  'alimentacion_bomba','toma_termotanque'];
const TIPOS = [['artefacto','Artefactos','#2b6ca3'],['toma','Tomas','#2f7d5c'],
  ['llave','Teclas','#e2a33d'],['alimentacion','Fuerza','#b5651d'],
  ['desconocido','Sin reconocer','#b3432f']];
const NOMBRES_AMB = ['cocina','comedor','estar','dormitorio','baño','toilette','pasillo',
  'lavadero','cochera','galería','oficina','vestidor','exterior','desconocido'];
const ZOOM = 2;

const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const OBRA_ID = params.get('obra');
let obra = null, sel = null, selAmb = null, visibles = new Set(TIPOS.map(t=>t[0]));

const api = async (ruta, opts={}) => {
  const r = await fetch(ruta, {headers:{'Content-Type':'application/json'}, ...opts});
  const d = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.error || 'Error inesperado');
  return d;
};
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';
  clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',3000);}
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g,
  c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- transformación metros -> puntos del PDF ---------- */
function aPt(xm, ym){
  const r = obra.plano.referencia, k = obra.plano.escala.ptPorMetro;
  return [r.origenPdfPt.x + xm*k, r.origenPdfPt.y - ym*k];
}

/* ---------- carga ---------- */
async function cargar(){
  obra = await api('/api/obras/'+OBRA_ID);
  $('h-nombre').textContent = obra.obra.nombre;
  if(!obra.plano){
    $('h-sub').textContent = 'Esta obra todavía no tiene plano cargado.';
    return;
  }
  const img = $('hoja');
  img.onload = () => { dimensionar(); pintarTodo(); };
  img.src = '/api/obras/'+OBRA_ID+'/plano.png?zoom='+ZOOM+'&t='+Date.now();
  if(obra.plano.escala) $('i-escala').value = obra.plano.escala.ptPorMetro;
  if(!obra.elementos.length){
    $('h-sub').textContent = 'Plano cargado, sin leer todavía. Tocá "Volver a leer".';
  }
}
function dimensionar(){
  const p = obra.plano.paginaPt || {ancho:842, alto:1191};
  $('capa').setAttribute('viewBox', `0 0 ${p.ancho} ${p.alto}`);
  $('envoltorio').style.width = $('hoja').naturalWidth + 'px';
}

/* ---------- pintado ---------- */
function pintarTodo(){ pintarCapa(); pintarPanel(); }

function pintarCapa(){
  if(!obra.plano || !obra.plano.referencia) return;
  const capa = $('capa');
  let html = '';
  (obra.ambientes||[]).forEach(a=>{
    const pts = (a.poligonoM||[]).map(([x,y])=>aPt(x,y).map(v=>v.toFixed(1)).join(',')).join(' ');
    if(!pts) return;
    html += `<polygon class="amb${a.esExterior?' exterior':''}${selAmb===a.id?' sel':''}"
      points="${pts}" data-amb="${a.id}"><title>${esc(a.nombre)} · ${a.areaM2} m²</title></polygon>`;
    if(!a.esExterior){
      const c = centro(a.poligonoM);
      const p = aPt(c[0], c[1]);
      html += `<text class="amb-txt" x="${p[0].toFixed(1)}" y="${p[1].toFixed(1)}">${esc(a.nombre)}</text>`;
    }
  });
  (obra.elementos||[]).forEach(e=>{
    if(!visibles.has(e.tipo)) return;
    const x = e.posicionPdfPt.x, y = e.posicionPdfPt.y;
    const dudoso = (Math.min(...Object.values(e.confianza||{simbolo:1}))||1) < 0.6;
    html += `<circle class="el ${e.tipo}${sel===e.id?' sel':''}${dudoso?' dudoso':''}"
      cx="${x}" cy="${y}" r="3.4" data-el="${e.id}"><title>${esc(rotulo(e))}</title></circle>`;
    if(e.revisadoPorUsuario)
      html += `<circle class="marca-rev" cx="${x}" cy="${y}" r="1.1"/>`;
  });
  const o = obra.plano.referencia.origenPdfPt;
  html += `<path class="origen" d="M${o.x-6},${o.y} h12 M${o.x},${o.y-6} v12" fill="none"/>`;
  capa.innerHTML = html;
  capa.querySelectorAll('[data-el]').forEach(n =>
    n.onclick = () => { sel = n.dataset.el; selAmb = null; pintarTodo(); });
  capa.querySelectorAll('[data-amb]').forEach(n =>
    n.onclick = () => { selAmb = n.dataset.amb; sel = null; pintarTodo(); });
}
function centro(poly){
  const xs = poly.map(p=>p[0]), ys = poly.map(p=>p[1]);
  return [(Math.min(...xs)+Math.max(...xs))/2, (Math.min(...ys)+Math.max(...ys))/2];
}
function rotulo(e){
  const p = [e.subtipo||e.tipo];
  if(e.nombre) p.push('“'+e.nombre+'”');
  if(e.letra) p.push('tecla '+e.letra);
  if(e.alturaM!=null) p.push('h '+e.alturaM.toFixed(2)+' m');
  if(e.tipoComando) p.push(e.tipoComando);
  return p.join(' · ');
}

/* ---------- panel ---------- */
function pintarPanel(){
  const els = obra.elementos||[];
  const cuenta = t => els.filter(e=>e.tipo===t).length;
  const teclas = els.filter(e=>e.tipo==='llave');
  const letras = new Set(teclas.map(e=>e.letra));
  const comb = [...letras].filter(l => teclas.filter(e=>e.letra===l).length>1).length;
  $('p-cifras').innerHTML = [
    ['Artefactos', cuenta('artefacto')], ['Tomas', cuenta('toma')],
    ['Teclas', teclas.length], ['Circuitos', letras.size],
    ['Combinados', comb], ['Ambientes', (obra.ambientes||[]).filter(a=>!a.esExterior).length],
  ].map(([k,v])=>`<div class="cifra"><b>${v}</b><span>${k}</span></div>`).join('');

  const esc_ = obra.plano?.escala;
  $('p-escala').innerHTML = esc_
    ? `Escala ${esc(esc_.nominal)} · ${esc_.ptPorMetro.toFixed(3)} pt/m · ${
        esc_.metodo==='cadena_de_cotas'
          ? 'medida sobre las cotas del plano'
          : esc_.metodo==='manual' ? 'puesta a mano'
          : '<b style="color:var(--danger)">asumida: el plano no tiene cotas</b>'}`
    : '';
  $('h-sub').textContent = esc_
    ? `${els.length} elementos · escala ${esc_.nominal}` : 'Sin leer';

  $('p-leyenda').innerHTML = TIPOS.map(([t,l,c])=>
    `<label><input type="checkbox" data-t="${t}" ${visibles.has(t)?'checked':''}>
      <span class="pt" style="background:${c}"></span>${l}</label>`).join('');
  $('p-leyenda').querySelectorAll('input').forEach(i => i.onchange = () => {
    i.checked ? visibles.add(i.dataset.t) : visibles.delete(i.dataset.t);
    pintarCapa();
  });

  $('p-ambientes').innerHTML = (obra.ambientes||[]).filter(a=>!a.esExterior)
    .map(a=>`<div data-amb="${a.id}"><span>${esc(a.nombre)}${
      a.origenNombre==='usuario'?' <span class="pastilla ok">tuyo</span>':''}</span>
      <span class="m2">${a.areaM2} m²</span></div>`).join('')
    || '<div class="vacio-panel">Todavía no hay ambientes.</div>';
  $('p-ambientes').querySelectorAll('[data-amb]').forEach(n =>
    n.onclick = () => { selAmb = n.dataset.amb; sel = null; pintarTodo(); });

  const v = obra.validacion||{};
  const avisos = [...(v.errores||[]).map(a=>({...a,g:'error'})),
                  ...(v.advertencias||[])];
  $('p-navisos').textContent = avisos.length || '';
  $('p-navisos').className = 'pastilla' + ((v.errores||[]).length ? ' baja' : '');
  $('p-avisos').innerHTML = avisos.length ? avisos.map((a,i)=>
    `<div class="aviso-item ${a.g==='error'?'error':''}" data-i="${i}">${esc(a.detalle||a.tipo)}</div>`
  ).join('') : '<div class="vacio-panel">Nada pendiente.</div>';
  $('p-avisos').querySelectorAll('[data-i]').forEach(n => n.onclick = () => {
    const a = avisos[n.dataset.i];
    if(a.simbolo){ sel = a.simbolo; selAmb = null; }
    else if(a.ambienteId){ selAmb = a.ambienteId; sel = null; }
    pintarTodo(); centrarEnSeleccion();
  });

  pintarEditor();
}

function pintarEditor(){
  const cont = $('p-editor');
  if(selAmb){
    const a = (obra.ambientes||[]).find(x=>x.id===selAmb);
    if(!a) return;
    cont.innerHTML = `
      <div class="campo"><label for="e-anom">Nombre del ambiente</label>
        <input id="e-anom" list="l-amb" value="${esc(a.nombre)}">
        <datalist id="l-amb">${NOMBRES_AMB.map(n=>`<option value="${n}">`).join('')}</datalist></div>
      <div style="font-size:.74rem;color:var(--muted)">${a.areaM2} m² ·
        ${a.origenNombre==='usuario'?'puesto por vos':'nombre sugerido'}</div>`;
    $('e-anom').onchange = ev => {
      a.nombre = ev.target.value.trim() || 'desconocido';
      a.origenNombre = 'usuario'; a.confianzaNombre = 1;
      pintarTodo();
    };
    return;
  }
  const e = (obra.elementos||[]).find(x=>x.id===sel);
  if(!e){
    cont.innerHTML = '<div class="vacio-panel">Tocá un elemento o un ambiente del plano para corregirlo.</div>';
    return;
  }
  const opciones = e.tipo==='toma' ? SUBTIPOS_TOMA
    : e.tipo==='artefacto' ? SUBTIPOS_ART
    : e.tipo==='alimentacion' ? SUBTIPOS_ALIM : [];
  const amb = (obra.ambientes||[]);
  cont.innerHTML = `
    <div style="font-size:.7rem;color:var(--muted);margin-bottom:8px" class="mono">${esc(e.id)}</div>
    ${opciones.length ? `<div class="campo"><label for="e-sub">Qué es</label>
      <select id="e-sub">${opciones.map(o=>
        `<option ${o===e.subtipo?'selected':''}>${o}</option>`).join('')}</select></div>` : ''}
    <div class="fila2">
      ${e.tipo!=='llave' ? `<div class="campo"><label for="e-alt">Altura (m)</label>
        <input id="e-alt" type="number" step="0.05" value="${e.alturaM??''}"></div>` : ''}
      ${e.tipo==='artefacto' ? `<div class="campo"><label for="e-nom">Letra</label>
        <input id="e-nom" maxlength="2" value="${esc(e.nombre??'')}"></div>` : ''}
      ${e.tipo==='llave' ? `<div class="campo"><label for="e-let">Tecla</label>
        <input id="e-let" maxlength="2" value="${esc(e.letra??'')}"></div>` : ''}
    </div>
    <div class="campo"><label for="e-amb">Ambiente</label>
      <select id="e-amb"><option value="">— sin ambiente —</option>
        ${amb.map(a=>`<option value="${a.id}" ${a.id===e.ambienteId?'selected':''}
          >${esc(a.nombre)} (${a.areaM2} m²)</option>`).join('')}</select></div>
    <div style="font-size:.74rem;color:var(--muted);margin-bottom:9px">
      ${e.tipoComando?`<span class="pastilla">${esc(e.tipoComando)}</span>`:''}
      ${e.etiquetaTexto?esc(e.etiquetaTexto):''}
      ${(e.notas||[]).length?'<br>'+esc(e.notas.join(' · ')):''}
    </div>
    <button class="btn sm ${e.revisadoPorUsuario?'':'primary'}" id="e-rev">
      ${e.revisadoPorUsuario?'Revisado ✓ (desmarcar)':'Marcar como revisado'}</button>
    <div style="font-size:.7rem;color:var(--muted);margin-top:7px;line-height:1.4">
      Lo revisado no se pisa cuando volvés a leer el plano.</div>`;

  const marcar = () => { e.revisadoPorUsuario = true; };
  if($('e-sub')) $('e-sub').onchange = ev => { e.subtipo = ev.target.value; marcar(); pintarTodo(); };
  if($('e-alt')) $('e-alt').onchange = ev => {
    e.alturaM = ev.target.value === '' ? null : parseFloat(ev.target.value); marcar(); pintarTodo(); };
  if($('e-nom')) $('e-nom').onchange = ev => {
    e.nombre = ev.target.value.trim().toUpperCase() || null;
    e.interruptor = e.nombre ? e.nombre.toLowerCase() : null; marcar(); pintarTodo(); };
  if($('e-let')) $('e-let').onchange = ev => {
    e.letra = ev.target.value.trim().toLowerCase() || null; marcar(); pintarTodo(); };
  $('e-amb').onchange = ev => { e.ambienteId = ev.target.value || null; marcar(); pintarTodo(); };
  $('e-rev').onclick = () => { e.revisadoPorUsuario = !e.revisadoPorUsuario; pintarTodo(); };
}

function centrarEnSeleccion(){
  const n = $('capa').querySelector('.sel');
  if(n) n.scrollIntoView({block:'center', inline:'center', behavior:'smooth'});
}

/* ---------- acciones ---------- */
$('b-extraer').onclick = async () => {
  const b = $('b-extraer'); b.disabled = true; b.textContent = 'Leyendo…';
  try{
    const cuerpo = {};
    const v = parseFloat($('i-escala').value);
    if(v > 0) cuerpo.escalaPtPorMetro = v;
    const nombres = (obra.ambientes||[]).filter(a=>a.origenNombre==='usuario')
      .map(a=>({ambienteId:a.id, nombre:a.nombre}));
    if(nombres.length) cuerpo.correcciones = {ambientes: nombres};
    const r = await api('/api/obras/'+OBRA_ID+'/extraer',
      {method:'POST', body:JSON.stringify(cuerpo)});
    obra = r.obra; sel = null; selAmb = null;
    pintarTodo();
    const c = r.cambios;
    toast(c.conservados
      ? `Leído. ${c.altas} nuevos, ${c.bajas} ya no están, ${c.conservados} revisados intactos.`
      : `Leído: ${r.resumen.artefactos} artefactos, ${r.resumen.tomas} tomas, ${r.resumen.teclas} teclas.`);
  }catch(err){ toast(err.message); }
  finally{ b.disabled = false; b.textContent = 'Volver a leer'; }
};
$('b-guardar').onclick = async () => {
  try{
    await api('/api/obras/'+OBRA_ID, {method:'PUT', body:JSON.stringify(obra)});
    toast('Guardado');
  }catch(err){ toast(err.message); }
};
$('b-volver').onclick = () => location.href = '/';
document.addEventListener('keydown', e => {
  if(e.key==='Escape'){ sel=null; selAmb=null; pintarTodo(); }
  if((e.ctrlKey||e.metaKey) && e.key==='s'){ e.preventDefault(); $('b-guardar').click(); }
});

cargar().catch(e => { $('h-sub').textContent = e.message; });
</script>
</body>
</html>
