<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lista de precios</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
:root{
  --navy:#16283f; --navy-deep:#0e1c2e; --paper:#f1f3f2; --panel:#fff; --line:#dde3e2;
  --ink:#1c2733; --muted:#5b6b7a; --amber:#e2a33d; --amber-deep:#c07f1f;
  --copper:#b5651d; --copper-soft:#f4e3d3; --slate-soft:#eef1f3;
  --green:#2f7d5c; --green-soft:#dcefe4; --danger:#b3432f; --danger-soft:#f8ded7;
  --radius:10px; font-family:'IBM Plex Sans',system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink)}
button{font:inherit;cursor:pointer} input,select{font:inherit}
.mono{font-family:'IBM Plex Mono',Consolas,monospace}
header{background:var(--navy);color:#fff;padding:11px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-family:'Space Grotesk',sans-serif;font-size:.98rem;margin:0;font-weight:600}
header .sub{font-size:.72rem;color:#9db2c7}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 13px;
  border-radius:var(--radius);font-size:.82rem;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--amber);border-color:var(--amber-deep);color:#2a1e07;font-weight:600}
.btn.ghost{background:transparent;border-color:#33506e;color:#cfe0f0}
.btn.sm{padding:4px 9px;font-size:.75rem}
main{max-width:940px;margin:0 auto;padding:22px 18px 60px}
.barra{display:flex;gap:9px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.barra input,.barra select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
tabla,table{width:100%;border-collapse:collapse;background:var(--panel);
  border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
th{text-align:left;font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;
  color:var(--muted);padding:9px 11px;background:var(--slate-soft);font-weight:600}
td{padding:6px 11px;border-top:1px solid var(--line);font-size:.84rem}
td input,td select{width:100%;border:1px solid transparent;background:transparent;
  padding:5px 6px;border-radius:6px}
td input:focus,td select:focus{outline:none;border-color:var(--copper);background:#fff}
td.precio input{text-align:right;font-family:'IBM Plex Mono',monospace;font-weight:600}
.grupo td{background:var(--slate-soft);font-weight:600;font-size:.74rem;
  text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.acc{width:34px;text-align:center}
.acc button{border:none;background:transparent;color:var(--danger);font-size:1rem;padding:2px 6px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy-deep);
  color:#fff;padding:10px 17px;border-radius:var(--radius);font-size:.82rem;display:none}
.ayuda{color:var(--muted);font-size:.8rem;line-height:1.5;margin:0 0 16px}
</style>
</head>
<body>
<header>
  <div><h1>Lista de precios</h1><div class="sub" id="h-sub">Cargando…</div></div>
  <div class="spacer"></div>
  <button class="btn ghost" id="b-agregar">Agregar ítem</button>
  <button class="btn ghost" id="b-volver">Volver</button>
  <button class="btn primary" id="b-guardar">Guardar</button>
</header>
<main>
  <p class="ayuda">Esta lista es la misma para todas las obras. Cuando congelás un
    presupuesto, los precios se copian adentro de esa obra y dejan de moverse
    aunque después actualices acá.</p>
  <div class="barra">
    <input id="f-buscar" placeholder="Buscar ítem" style="min-width:220px">
    <select id="f-cat"><option value="">Todas las categorías</option></select>
    <div class="spacer"></div>
    <label style="font-size:.8rem;color:var(--muted)">Ajustar todo
      <input id="i-ajuste" type="number" step="0.5" style="width:72px" placeholder="%">
      <button class="btn sm" id="b-ajustar">Aplicar</button></label>
  </div>
  <table><thead><tr>
    <th style="width:38%">Ítem</th><th style="width:20%">Categoría</th>
    <th style="width:12%">Unidad</th><th style="width:22%">Precio</th><th class="acc"></th>
  </tr></thead><tbody id="cuerpo"></tbody></table>
</main>
<div id="toast"></div>
<script>
const CATEGORIAS = ["Puntos","Tomacorrientes","Tableros","Canalización","Artefactos",
                    "Mano de obra","Materiales","Otros"];
const $ = id => document.getElementById(id);
let lista = null;
const api = async (r,o={}) => {
  const res = await fetch(r,{headers:{'Content-Type':'application/json'},...o});
  const d = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(d.error||'Error'); return d;
};
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';
  clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',2800);}
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g,
  c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const plata = n => (n||0).toLocaleString('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0});

async function cargar(){
  lista = await api('/api/precios');
  $('f-cat').innerHTML = '<option value="">Todas las categorías</option>' +
    CATEGORIAS.map(c=>`<option>${c}</option>`).join('');
  pintar();
}
function visibles(){
  const q = $('f-buscar').value.trim().toLowerCase(), c = $('f-cat').value;
  return lista.items.filter(i =>
    (!q || (i.item||'').toLowerCase().includes(q)) && (!c || i.categoria === c));
}
function pintar(){
  const items = visibles();
  const porCat = {};
  items.forEach(i => (porCat[i.categoria||'Otros'] = porCat[i.categoria||'Otros']||[]).push(i));
  $('cuerpo').innerHTML = Object.entries(porCat).map(([cat, arr]) =>
    `<tr class="grupo"><td colspan="5">${esc(cat)} · ${arr.length}</td></tr>` +
    arr.map(i=>`<tr data-id="${i.id}">
      <td><input data-c="item" value="${esc(i.item)}"></td>
      <td><select data-c="categoria">${CATEGORIAS.map(c=>
        `<option ${c===i.categoria?'selected':''}>${c}</option>`).join('')}</select></td>
      <td><input data-c="unidad" value="${esc(i.unidad||'u')}"></td>
      <td class="precio"><input data-c="precio" type="number" step="1" value="${i.precio||0}"></td>
      <td class="acc"><button data-borrar="${i.id}" title="Borrar">×</button></td>
    </tr>`).join('')).join('') ||
    '<tr><td colspan="5" style="color:var(--muted);padding:18px">Nada coincide.</td></tr>';

  $('cuerpo').querySelectorAll('[data-c]').forEach(n => n.onchange = () => {
    const id = n.closest('tr').dataset.id;
    const it = lista.items.find(x=>x.id===id);
    it[n.dataset.c] = n.dataset.c==='precio' ? parseFloat(n.value||0) : n.value;
    if(n.dataset.c === 'categoria') pintar();
    actualizarTotalizador();
  });
  $('cuerpo').querySelectorAll('[data-borrar]').forEach(n => n.onclick = () => {
    lista.items = lista.items.filter(x=>x.id!==n.dataset.borrar);
    pintar();
  });
  actualizarTotalizador();
}
function actualizarTotalizador(){
  const cargados = lista.items.filter(i=>i.precio>0).length;
  $('h-sub').textContent = `${lista.items.length} ítems · ${cargados} con precio` +
    (lista.actualizadoEl ? ` · actualizada ${new Date(lista.actualizadoEl).toLocaleDateString('es-AR')}` : '');
}
$('b-agregar').onclick = () => {
  lista.items.push({id:'pr_'+Date.now().toString(36), categoria:$('f-cat').value||'Otros',
                    item:'Ítem nuevo', unidad:'u', precio:0});
  pintar();
  const filas = $('cuerpo').querySelectorAll('tr[data-id] input[data-c="item"]');
  filas[filas.length-1]?.focus();
};
$('b-ajustar').onclick = () => {
  const p = parseFloat($('i-ajuste').value);
  if(!p){ toast('Poné un porcentaje.'); return; }
  const n = visibles().length;
  if(!confirm(`¿Ajustar ${n} ítems un ${p}%?`)) return;
  visibles().forEach(i => i.precio = Math.round(i.precio * (1 + p/100)));
  $('i-ajuste').value = '';
  pintar(); toast(`${n} ítems ajustados`);
};
$('b-guardar').onclick = async () => {
  try{ lista = await api('/api/precios',{method:'POST',body:JSON.stringify(lista)});
    pintar(); toast('Lista guardada');
  }catch(e){ toast(e.message); }
};
$('b-volver').onclick = () => location.href = '/';
['f-buscar','f-cat'].forEach(id => $(id).addEventListener('input', pintar));
document.addEventListener('keydown', e => {
  if((e.ctrlKey||e.metaKey) && e.key==='s'){ e.preventDefault(); $('b-guardar').click(); }
});
cargar().catch(e => toast(e.message));
</script>
</body>
</html>
